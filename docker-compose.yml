services:
  jekyll:
    image: jekyll/jekyll:latest
    container_name: jekyll-build
    volumes:
      - .:/srv/jekyll
    command: jekyll build   # Build the site statically
    environment:
      JEKYLL_ENV: production
      JEKYLL_BASEURL: portfolio

  nginx:
    image: nginx:alpine
    container_name: jekyll-serve
    ports:
      - "4000:80"
    volumes:
      - ./_site:/usr/share/nginx/html   # Serve the static site generated by Jekyll