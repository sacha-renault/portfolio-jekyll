services:
  jekyll:
    image: jekyll/jekyll:latest
    container_name: jekyll-build
    volumes:
      - .:/srv/jekyll
    command: sh -c "gem install bundler -v 2.2.33 && bundle _2.2.33_ install && jekyll build --config _config.yml"

    environment:
      JEKYLL_ENV: production
      JEKYLL_BASEURL: /me

  nginx:
    image: nginx:alpine
    container_name: jekyll-serve
    ports:
      - "4000:80"
    volumes:
      - ./_site:/usr/share/nginx/html   # Serve the static site generated by Jekyll