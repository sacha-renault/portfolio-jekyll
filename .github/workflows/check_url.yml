name: URL Availability Checker

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-url:
    runs-on: ubuntu-latest
    
    # You can set up multiple URLs by creating environment variables or using a matrix
    env:
      URL_TO_CHECK: "http://me.sacharenault.ovh/me/132"  # Replace with your URL
      MAX_RETRIES: 3
      RETRY_DELAY: 5
    
    steps:
      - name: Check if URL is accessible
        run: |
          attempt=1
          http_code=0
          
          while [ $attempt -le $MAX_RETRIES ]; do
            echo "Attempt $attempt of $MAX_RETRIES"
            
            # Use curl to check URL with redirect following
            http_code=$(curl -L -s -o /dev/null -w "%{http_code}" $URL_TO_CHECK)
            
            # Check if HTTP code indicates success (2xx)
            if [[ $http_code -ge 200 && $http_code -lt 300 ]]; then
              echo "✅ URL is accessible. HTTP status code: $http_code"
              exit 0
            fi
            
            echo "❌ URL is not accessible. HTTP status code: $http_code"
            
            # If this wasn't the last attempt, wait before retrying
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Waiting ${RETRY_DELAY}s before next attempt..."
              sleep $RETRY_DELAY
            fi
            
            attempt=$((attempt+1))
          done
          
          # If we get here, all attempts failed
          echo "::error::URL check failed after $MAX_RETRIES attempts. Last status code: $http_code"
          exit 1
